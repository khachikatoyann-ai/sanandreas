name: Build iOS IPA for Sideloadly

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA with Xcode
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download & Install Godot 4.7.2 macOS
        run: |
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          unzip -q /tmp/godot.zip -d /tmp/godot_bin
          mv /tmp/godot_bin/Godot.app /Applications/

      - name: Download & Install Godot 4.7.2 Export Templates
        run: |
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          curl -L -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"

      - name: Export Xcode Project from Godot
        run: |
          mkdir -p build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --path . --headless --export-debug "iOS" "build/ios/LosSantosAdvanced.zip"

      - name: Compile Native Mach-O Executable via Xcode
        run: |
          cd build/ios
          xcodebuild build \
            -project LosSantosAdvanced.xcodeproj \
            -scheme LosSantosAdvanced \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/output"
            
          mkdir -p Payload
          cp -r output/LosSantosAdvanced.app Payload/
          zip -qr LosSantosAdvanced.ipa Payload/

      - name: Upload Ready-to-Sideload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LosSantosAdvanced-iOS-IPA
          path: build/ios/LosSantosAdvanced.ipa
